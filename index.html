<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undertale</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/1e295a49108e716ce8ab7eba0c8dca7d/9326265e4f1b14345a3bdab6f8ffad0e2e7ab3fda920c5f0f095f77359af00aeae22591c5bc4914c84c13d99eb62091d7ce7@main/style.css">
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/1e295a49108e716ce8ab7eba0c8dca7d/9326265e4f1b14345a3bdab6f8ffad0e2e7ab3fda920c5f0f095f77359af00aeae22591c5bc4914c84c13d99eb62091d7ce7@main/fav.ico">
  <style>
    #splash-screen { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:9999; align-items:center; justify-content:center; flex-direction:column; font-family:'8BitOperator',monospace,sans-serif; color:#fff; text-align:center; }
    #splash-screen.active { display:flex; }
    #splash-box { border:2px solid #444; border-radius:10px; padding:40px 56px; background:#0a0a0a; max-width:480px; }
    #splash-box h2 { font-size:20px; margin:0 0 18px; color:#fff; }
    #splash-box p { font-size:15px; color:#ccc; line-height:1.7; margin:0 0 24px; }
    #splash-bar-wrap { width:100%; background:#222; border-radius:4px; height:4px; overflow:hidden; margin-top:8px; }
    #splash-bar { height:4px; width:0%; background:#5865F2; transition:width linear; }
    #splash-skip { margin-top:18px; font-size:12px; color:#555; }
    #game-container { display:none; position:fixed; inset:0; z-index:1000; background:#000; }
    #game-container.active { display:block; }
    #game-iframe { width:100%; height:100%; border:none; }
    #exit-btn { position:absolute; top:12px; right:12px; width:48px; height:48px; cursor:pointer; z-index:10001; image-rendering:pixelated; opacity:.85; transition:opacity .1s,transform .1s; }
    #exit-btn:hover { opacity:1; transform:scale(1.1); }
    #exit-btn:active { transform:scale(.95); }
    #exit-btn canvas { display:block; width:48px; height:48px; image-rendering:pixelated; }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div id="splash-box">
      <h2>Howdy!</h2>
      <p>Use the button in the top right to return to the launcher!<br>Click on the game for sound!</p>
      <div id="splash-bar-wrap"><div id="splash-bar"></div></div>
    </div>
    <div id="splash-skip">Click anywhere to skip</div>
  </div>
  <div id="game-container">
    <iframe id="game-iframe" allowfullscreen></iframe>
    <div id="exit-btn" title="Back to Launcher"><canvas id="exit-canvas" width="16" height="16"></canvas></div>
  </div>
  <main id="launcher" class="container">
    <h2 style="font-family:'8BitOperator',sans-serif">welcome to</h2>
    <h1 class="shortpie">&nbsp;the-oblyv's</h1>
    <br><br>
    <img src="/localspace.png" alt="Undertale logo" class="logo">
    <div class="button-group">
      <div class="chapter-buttons">
        <button id="utweb" class="chapter-button-1"><span class="button-label">UNDERTALE</span></button>
      </div>
    </div>
    <h5 style="font-size:23px;margin-bottom:14px;margin-top:32px"><br>Undertale port originally made by <br>.shortpie.</h5>
    <h5 style="font-size:23px;margin-bottom:14px;margin-top:32px"><br>Undertale is created by <br>Toby Fox</h5>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
